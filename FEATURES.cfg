# Pocket AdBlock: optional features for your own build.  1 = on, 0 = off.
#
# Everything else (blocking, cache, CNAME check, bypass protection, SafeSearch,
# local names, Wake-on-LAN, MQTT / Home Assistant) is always built in and
# switched on or off in the web UI. The options below cost extra RAM, so they
# are chosen at build time. Edit, then rebuild (idf.py build): this file wins
# over menuconfig for these options.
#
# Prebuilt releases come in two editions that update themselves online:
#   Lite = flavours/lite.cfg (all off)    Plus = flavours/plus.cfg (all on)
# A build made with this file is a "custom" build: it never auto-installs
# release images (the web UI still takes a manual firmware upload).

# Long query history: keep LONG_HISTORY_ENTRIES queries (76 B each) instead of 32.
# PSRAM recommended (falls back to 64 entries in internal RAM without it).
ENABLE_LONG_HISTORY = 0
LONG_HISTORY_ENTRIES = 4096

# RAM bloom filter in front of the flash blocklist: not-listed lookups get faster
# (80.8 -> 54.7 us on an S3). ~1.25 B per slot entry (~270 KB / ~1 MB).
# PSRAM only in practice; not for the ESP32-C3.
ENABLE_BLOOM_FILTER = 0

# Encrypted upstream (DNS over TLS, port 853). ~26 KB internal RAM while connected
# + 6 KB task stack. Boards with PSRAM; not the ESP32-C3.
ENABLE_DNS_OVER_TLS = 0

# Top allowed / blocked domains on the overview. ~60 B of PSRAM per counter;
# turns itself off on boards without PSRAM.
ENABLE_TOP_DOMAINS = 0
TOP_DOMAINS_ENTRIES = 2048
