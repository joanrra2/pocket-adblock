<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{{t:inst.title}}</title>
{{alternates}}
<!-- ESP Web Tools 10.4.0, served from this site (copied and integrity-checked at release time). -->
<script type="module" src="{{root}}vendor/esp-web-tools/install-button.js"></script>
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
{{langpick}}
<style>
:root{--bg:#0b0f15;--s1:#121822;--s2:#19212d;--ln:#232d3b;--tx:#e7edf5;--mu:#8a97a8;--ac:#7c8cff;--wa:#fbbf24;--onac:#0b0f15}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f9;--s1:#fff;--s2:#eef1f6;--ln:#e0e5ed;--tx:#0f172a;--mu:#64748b;--ac:#5a5ff0;--wa:#b45309;--onac:#fff}}
*{box-sizing:border-box;margin:0}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.top{border-bottom:1px solid var(--ln)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.top .home{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--tx);text-decoration:none;margin-right:auto}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:var(--mu);text-decoration:none;font-weight:600;font-size:14.5px;padding:6px 10px;border-radius:9px}
.top nav a:hover,.top nav a[aria-current]{color:var(--tx);background:var(--s2)}
.kofi{font-weight:650;font-size:13.5px;padding:6px 11px;border-radius:9px;background:#d63a36;color:#fff;text-decoration:none}
.lang{position:relative}
.lang summary{list-style:none;cursor:pointer;color:var(--mu);font-weight:600;font-size:14.5px;padding:6px 10px;border-radius:9px;display:flex;align-items:center;gap:6px}
.lang summary::-webkit-details-marker{display:none}
.lang summary:hover,.lang[open] summary{color:var(--tx);background:var(--s2)}
.lang ul{position:absolute;right:0;top:calc(100% + 6px);list-style:none;padding:6px;margin:0;background:var(--s1);border:1px solid var(--ln);border-radius:12px;min-width:150px;z-index:20;box-shadow:0 8px 24px rgb(0 0 0/.25)}
.lang li{margin:0}
.lang li a{display:block;padding:7px 10px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14.5px}
.lang li a:hover{background:var(--s2)}
.lang li a[aria-current]{color:var(--ac);font-weight:650}
.page{display:grid;place-items:center;padding:24px 16px 40px}
@media (max-width:480px){.top .in{gap:6px 8px;padding:8px 12px}.top nav{gap:0}.top nav a,.lang summary{padding:6px 7px;font-size:14px}.kofi{padding:6px 9px}.top nav a[href^="https://github.com"]{display:none}}
main{max-width:560px;width:100%}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;margin-bottom:6px}
p{color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:20px;margin-top:20px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:6px}
select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
esp-web-install-button{display:block;margin-top:16px}
.lbl{font-size:13px;color:var(--mu);margin:16px 0 6px}
.eds{display:grid;gap:10px}
.ed{display:block;position:relative;border:1px solid var(--ln);border-radius:12px;padding:12px 14px 12px 40px;cursor:pointer;color:var(--tx);font-size:15px;margin:0}
.ed input{position:absolute;left:14px;top:15px;accent-color:var(--ac)}
.ed:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.ed:has(input:disabled){opacity:.55;cursor:not-allowed}
.ed .tag{font-size:12px;color:var(--mu);margin-left:8px}
.ed .d{display:block;color:var(--mu);font-size:13.5px;margin-top:4px}
.ed ul.d{padding-left:18px}.ed ul.d li{margin:2px 0}
.ed .na{color:var(--wa)}
.hint{font-size:13px;margin-top:10px}
button.go{font:inherit;font-weight:650;padding:11px 18px;border-radius:11px;border:0;background:var(--ac);color:var(--onac);cursor:pointer;width:100%}
ol{padding-left:20px;color:var(--mu)}li{margin:4px 0}
.note{color:var(--wa);font-size:14px;margin-top:12px}
a{color:var(--ac)}
#ver{font-size:13px;color:var(--mu)}
</style>
</head>
<body>
<header class="top"><div class="in">
 <a class="home" href="{{base}}"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--ac)" opacity=".18"/><circle cx="16" cy="16" r="10" fill="var(--ac)" opacity=".4"/><circle cx="16" cy="16" r="5" fill="var(--ac)"/></svg>Pocket AdBlock</a>
 <nav aria-label="{{t:nav.label}}"><a href="{{base}}">{{t:nav.home}}</a><a href="{{base}}guide.html">{{t:nav.guide}}</a><a href="./" aria-current="page">{{t:nav.install}}</a><a href="{{REPO}}">GitHub</a></nav>
 {{langmenu}}
 <a class="kofi" href="https://ko-fi.com/joanramon">Ko-fi</a>
</div></header>
<div class="page">
<main>
 <div class="brand"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--ac)" opacity=".18"/><circle cx="16" cy="16" r="10" fill="var(--ac)" opacity=".4"/><circle cx="16" cy="16" r="5" fill="var(--ac)"/></svg>{{t:inst.h1}}</div>
 <p>{{t:inst.intro}} <span id="ver" data-text="{{t:inst.version}}"></span></p>
 <div class="card">
  <label for="board">{{t:inst.board}}</label>
  <select id="board">
   <option value="esp32c3">{{t:inst.b_c3}}</option>
   <option value="esp32s3">{{t:inst.b_s3}}</option>
   <option value="esp32s3-16mb">{{t:inst.b_s3_16}}</option>
   <option value="esp32s3-octal-flash">{{t:inst.b_s3_octal}}</option>
   <option value="esp32">{{t:inst.b_esp32}}</option>
   <option value="esp32c6">{{t:inst.b_c6}}</option>
   <option value="esp32c6-8mb">{{t:inst.b_c6_8}}</option>
  </select>
  <div class="lbl">{{t:inst.edition}}</div>
  <div class="eds" role="radiogroup" aria-label="{{t:inst.edition}}">
   <label class="ed" for="ed-lite"><input type="radio" name="edition" id="ed-lite" value="lite" checked>
    <b>Lite</b><span class="tag">{{t:inst.lite_tag}}</span>
    <span class="d">{{t:inst.lite_d}}</span></label>
   <label class="ed" for="ed-pro"><input type="radio" name="edition" id="ed-pro" value="pro">
    <b>Pro</b><span class="tag">{{t:inst.pro_tag}}</span>
    <span class="d">{{t:inst.pro_d}}</span>
    <ul class="d">{{t:inst.pro_list}}</ul>
    <span class="d na" id="pro-na" data-text="{{t:inst.pro_na}}"></span></label>
  </div>
  <p class="hint">{{t:inst.hint}}</p>
  <esp-web-install-button id="install">
   <button slot="activate" class="go">{{t:inst.go}}</button>
   <span slot="unsupported">{{t:inst.unsupported}}</span>
   <span slot="not-allowed">{{t:inst.https}}</span>
  </esp-web-install-button>
  <p class="note">{{t:inst.octal_note}}</p>
 </div>
 <div class="card">
  <ol>{{t:inst.steps}}</ol>
  <p style="margin-top:12px">{{t:inst.next}}</p>
 </div>
</main>
</div>
<script>
// Boards with a Pro build (they usually carry PSRAM); manifests/<board>[-pro].json
const PRO=['esp32s3','esp32s3-16mb','esp32s3-octal-flash','esp32'];
const sel=document.getElementById('board'),btn=document.getElementById('install');
const lite=document.getElementById('ed-lite'),pro=document.getElementById('ed-pro'),na=document.getElementById('pro-na'),ver=document.getElementById('ver');
const store=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const saved=store('board');
if(saved&&[...sel.options].some(o=>o.value==saved))sel.value=saved;
if(store('edition')=='pro')pro.checked=true;
function apply(){
 const ok=PRO.includes(sel.value);
 pro.disabled=!ok;
 if(!ok&&pro.checked)lite.checked=true;
 na.textContent=ok?'':na.dataset.text;
 const ed=pro.checked?'pro':'lite';
 btn.manifest='{{root}}manifests/'+sel.value+(ed=='pro'?'-pro':'')+'.json';
 store('board',sel.value);store('edition',ed);
 fetch(btn.manifest).then(r=>r.json()).then(m=>ver.textContent=ver.dataset.text.replace('{v}',m.version)).catch(()=>{});
}
sel.addEventListener('change',apply);lite.addEventListener('change',apply);pro.addEventListener('change',apply);apply();
</script>
</body>
</html>
