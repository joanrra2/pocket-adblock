name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (hash table, DNS packets)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Icomponents/blocklist/include -Icomponents/dns/include \
              test/host/test_logic.cpp -o test_logic
          ./test_logic

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: esp32c3,             target: esp32c3, defaults: "sdkconfig.defaults" }
          - { name: esp32s3,             target: esp32s3, defaults: "sdkconfig.defaults" }
          - { name: esp32s3-octal-flash, target: esp32s3, defaults: "sdkconfig.defaults;boards/esp32s3-octal-flash.defaults" }
          - { name: esp32,               target: esp32,   defaults: "sdkconfig.defaults" }
          - { name: esp32c6,             target: esp32c6, defaults: "sdkconfig.defaults" }
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: ver
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Release settings (update manifest URL, optional signing)
        id: cfg
        env:
          FW_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
          BL_PUBKEY: ${{ vars.BLOCKLIST_PUBKEY }}
        run: |
          {
            echo "CONFIG_SINKHOLE_FW_MANIFEST_URL=\"https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json\""
            echo "CONFIG_SINKHOLE_BLOCKLIST_URL=\"https://github.com/${GITHUB_REPOSITORY}/releases/download/blocklist/blocklist.bin\""
            [ -n "$BL_PUBKEY" ] && echo "CONFIG_SINKHOLE_BLOCKLIST_PUBKEY=\"$BL_PUBKEY\""
          } > ci.defaults
          extra=";ci.defaults"
          if [ -n "$FW_KEY" ]; then          # signed builds when the secret exists
            mkdir -p keys && printf '%s\n' "$FW_KEY" > keys/firmware_signing.pem
            extra="$extra;boards/signed-firmware.defaults"
          fi
          echo "extra=$extra" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.target }}
          command: >-
            idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}${{ steps.cfg.outputs.extra }}"
            ${{ startsWith(github.ref, 'refs/tags/v') && format('-D PROJECT_VER={0}', steps.ver.outputs.ver) || '' }}
            build merge-bin -o merged.bin
      - name: Collect
        run: |
          mkdir -p dist
          sudo cp build/merged.bin "dist/pocket-adblock-${{ matrix.name }}-full.bin"
          sudo cp build/pocket-adblock.bin "dist/pocket-adblock-${{ matrix.name }}-ota.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update manifest
        run: |
          python3 tools/make_manifest.py --version "$GITHUB_REF_NAME" --bins dist --out dist/manifest.json \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes \
            --notes "Flash *-full.bin at 0x0 for a first install (or use the browser installer); upload *-ota.bin from the web UI afterwards."

  # Browser installer (ESP Web Tools) on GitHub Pages, refreshed on every release.
  # One-time setup: repo Settings -> Pages -> Source: GitHub Actions.
  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assemble site
        run: python3 tools/make_installer.py --bins dist --version "${GITHUB_REF_NAME#v}" --out _site --repo "https://github.com/${GITHUB_REPOSITORY}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
