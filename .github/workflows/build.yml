name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (hash table, DNS packets)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Icomponents/blocklist/include -Icomponents/dns/include \
              test/host/test_logic.cpp -o test_logic
          ./test_logic

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: esp32c3,             target: esp32c3, defaults: "sdkconfig.defaults" }
          - { name: esp32s3,             target: esp32s3, defaults: "sdkconfig.defaults" }
          - { name: esp32s3-octal-flash, target: esp32s3, defaults: "sdkconfig.defaults;boards/esp32s3-octal-flash.defaults" }
          - { name: esp32,               target: esp32,   defaults: "sdkconfig.defaults" }
          - { name: esp32c6,             target: esp32c6, defaults: "sdkconfig.defaults" }
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: ver
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.target }}
          command: >-
            idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}"
            ${{ startsWith(github.ref, 'refs/tags/v') && format('-D PROJECT_VER={0}', steps.ver.outputs.ver) || '' }}
            build merge-bin -o merged.bin
      - name: Collect
        run: |
          mkdir -p dist
          sudo cp build/merged.bin "dist/esp-dns-sinkhole-${{ matrix.name }}-full.bin"
          sudo cp build/esp-dns-sinkhole.bin "dist/esp-dns-sinkhole-${{ matrix.name }}-ota.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes \
            --notes "Flash *-full.bin at 0x0 for a first install; upload *-ota.bin from the web UI afterwards."
