name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job may write (creates the release).
permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (hash table, DNS packets, notification answers)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Icomponents/blocklist/include -Icomponents/dns/include -Icomponents/notify/include \
              test/host/test_logic.cpp -o test_logic
          ./test_logic
      - name: Lists from tools/build_blocklist.py read the same on the device (v2 and v4)
        run: |
          # Names with listed parents too, so pruning is covered.
          python3 -c "
          for i in range(30000):
              print(f'ads{i}.tracker{i % 101}.example{i % 7}.com')
          for t in range(0, 101, 3):
              print(f'tracker{t}.example{t % 7}.com')
          " > domains.txt
          python3 tools/build_blocklist.py l2.bin domains.txt --format=v2
          python3 tools/build_blocklist.py l4.bin domains.txt
          ./test_logic l2.bin domains.txt
          ./test_logic l4.bin domains.txt

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two editions (flavours/*.cfg): Lite for every board, Pro (all build-time
        # extras) for boards that usually have PSRAM. Image names: <board> / <board>-pro,
        # which is also the key each edition looks up in the update manifest.
        include:
          - { name: esp32c3,                  target: esp32c3, flavour: lite, defaults: "sdkconfig.defaults" }
          - { name: esp32s3,                  target: esp32s3, flavour: lite, defaults: "sdkconfig.defaults" }
          - { name: esp32s3-octal-flash,      target: esp32s3, flavour: lite, defaults: "sdkconfig.defaults;boards/esp32s3-octal-flash.defaults" }
          - { name: esp32,                    target: esp32,   flavour: lite, defaults: "sdkconfig.defaults" }
          - { name: esp32c6,                  target: esp32c6, flavour: lite, defaults: "sdkconfig.defaults" }
          - { name: esp32c6-8mb,              target: esp32c6, flavour: lite, defaults: "sdkconfig.defaults;boards/esp32c6-8mb.defaults" }
          - { name: esp32s3-16mb,             target: esp32s3, flavour: lite, defaults: "sdkconfig.defaults;boards/esp32s3-16mb.defaults" }
          - { name: esp32s3-pro,             target: esp32s3, flavour: pro, defaults: "sdkconfig.defaults" }
          - { name: esp32s3-16mb-pro,         target: esp32s3, flavour: pro, defaults: "sdkconfig.defaults;boards/esp32s3-16mb.defaults" }
          - { name: esp32s3-octal-flash-pro, target: esp32s3, flavour: pro, defaults: "sdkconfig.defaults;boards/esp32s3-octal-flash.defaults" }
          - { name: esp32-pro,               target: esp32,   flavour: pro, defaults: "sdkconfig.defaults" }
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: ver
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Release settings (update manifest URL, optional signing)
        id: cfg
        env:
          FW_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
          BL_PUBKEY: ${{ vars.BLOCKLIST_PUBKEY }}
        run: |
          {
            echo "CONFIG_SINKHOLE_FW_MANIFEST_URL=\"https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json\""
            echo "CONFIG_SINKHOLE_BLOCKLIST_URL=\"https://github.com/${GITHUB_REPOSITORY}/releases/download/blocklist/blocklist.bin\""
            [ -n "$BL_PUBKEY" ] && echo "CONFIG_SINKHOLE_BLOCKLIST_PUBKEY=\"$BL_PUBKEY\""
          } > ci.defaults
          extra=";ci.defaults"
          # Signed builds when the secret exists. Not the classic ESP32: RSA signing
          # needs chip revision 3 there, and older chips would fall back to an ECDSA
          # scheme this RSA key cannot sign for.
          if [ -n "$FW_KEY" ] && [ "${{ matrix.target }}" != esp32 ]; then
            mkdir -p keys && printf '%s\n' "$FW_KEY" > keys/firmware_signing.pem
            extra="$extra;boards/signed-firmware.defaults"
          fi
          echo "extra=$extra" >> "$GITHUB_OUTPUT"
      - name: Build
        # Pinned to a commit: this action builds the images everyone flashes (v1 branch, 2024-11-08).
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.target }}
          command: >-
            idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}${{ steps.cfg.outputs.extra }}"
            -D FEATURES_FILE=flavours/${{ matrix.flavour }}.cfg
            ${{ startsWith(github.ref, 'refs/tags/v') && format('-D PROJECT_VER={0}', steps.ver.outputs.ver) || '' }}
            build merge-bin -o merged.bin
      - name: Collect
        run: |
          mkdir -p dist
          sudo cp build/merged.bin "dist/pocket-adblock-${{ matrix.name }}-full.bin"
          sudo cp build/pocket-adblock.bin "dist/pocket-adblock-${{ matrix.name }}-ota.bin"
          # Separate flash images for the browser installer (keeps settings on update).
          sudo python3 tools/collect_parts.py build "${{ matrix.name }}" parts
          sudo chown -R "$(id -u):$(id -g)" dist parts
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.name }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: parts-${{ matrix.name }}
          path: parts/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: dist
          merge-multiple: true
      - name: Update manifest
        run: |
          python3 tools/make_manifest.py --version "$GITHUB_REF_NAME" --bins dist --out dist/manifest.json \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # --latest: devices fetch releases/latest/download/manifest.json, so a
        # firmware release must always be "Latest", never the blocklist one.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --latest \
            --notes "Flash *-full.bin at 0x0 for a first install (or use the browser installer); upload *-ota.bin from the web UI afterwards."

  # Browser installer (ESP Web Tools) on GitHub Pages, refreshed on every release.
  # One-time setup: repo Settings -> Pages -> Source: GitHub Actions.
  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: parts-*
          path: parts
          merge-multiple: true
      # The flasher is served from this site, not a CDN: pinned version, checked
      # against the npm registry's published integrity before it is used.
      - name: ESP Web Tools (pinned, integrity-checked)
        run: |
          npm pack esp-web-tools@10.4.0 --silent
          echo "3pwkeFFm5Fj7UQo8SJNYK5RXrtNCpq6X9QoI6bMT4GBZWgrJqjn0YvM9ihG74BtMoSFYXfmDtkehuxe50PTMPQ==  esp-web-tools-10.4.0.tgz" > ewt.sha512b64
          python3 -c "import base64,hashlib;exp,f=open('ewt.sha512b64').read().split();got=base64.b64encode(hashlib.sha512(open(f,'rb').read()).digest()).decode();assert got==exp,('integrity mismatch',got)"
          tar xzf esp-web-tools-10.4.0.tgz
      - name: Assemble site
        run: python3 tools/make_installer.py --bins dist --version "${GITHUB_REF_NAME#v}" --out _site --repo "https://github.com/${GITHUB_REPOSITORY}" --web-tools package/dist/web --parts parts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
