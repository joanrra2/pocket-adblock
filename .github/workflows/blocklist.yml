name: blocklist

# Weekly SHBL blocklist with SHA-256 header, published at a stable URL:
#   https://github.com/<owner>/<repo>/releases/download/blocklist/blocklist.bin
on:
  schedule:
    - cron: "41 4 * * 1"   # Mondays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (fails if a source is unreachable)
        run: python3 tools/build_blocklist.py blocklist.bin | tee build.log
      - name: Sanity checks
        run: |
          size=$(stat -c%s blocklist.bin)
          test $(( (size - 64) % 5 )) -eq 0
          test "$size" -gt 250000                 # >50k domains: catches a silently shrunk list
          test "$size" -le $((0xD0000))           # fits a 4 MB-layout slot
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Auto-built $(date -u +%F): $(grep 'hash entries' build.log)"
          gh release view blocklist >/dev/null 2>&1 || \
            gh release create blocklist --title "Weekly blocklist" --notes "$notes" --latest=false
          gh release edit blocklist --notes "$notes"
          gh release upload blocklist blocklist.bin --clobber
