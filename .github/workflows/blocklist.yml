name: blocklist

# Daily SHBL blocklists with SHA-256 header, published at stable URLs:
#   https://github.com/<owner>/<repo>/releases/download/blocklist/blocklist.bin
# Each list goes out twice: <name>.bin in the compact format (v2) that every
# firmware reads, and <name>-v4.bin as a fuse filter, which firmware 0.5.0 and
# later fetch instead (smaller, faster). The v2 names must never carry a v4 list:
# older firmware rejects it and would stop updating.
on:
  schedule:
    - cron: "41 4 * * *"   # daily 04:41 UTC (HaGeZi updates daily; devices fetch only when it changed)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # update the "blocklist" release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (fails if a source of the main lists is unreachable)
        env:
          BL_KEY: ${{ secrets.BLOCKLIST_SIGNING_KEY }}
        run: |
          set -o pipefail   # a failed build must not hide behind tee
          sign=""
          if [ -n "$BL_KEY" ]; then          # signed lists when the secret exists
            pip install --quiet --only-binary :all: "cryptography==50.0.2"
            printf '%s\n' "$BL_KEY" > /tmp/bl.pem && sign="--sign=/tmp/bl.pem"
          fi
          SB=https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
          HZ=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard
          # Sources are downloaded once, so both formats hold exactly the same domains.
          mkdir -p src
          get() { curl -sSfL --retry 3 -o "src/$1" "$2"; }
          get sb.txt "$SB"
          get light.txt "$HZ/light-onlydomains.txt"
          get pro.txt "$HZ/pro-onlydomains.txt"
          get tif.txt "$HZ/tif-onlydomains.txt" || echo "::warning::HaGeZi TIF not downloaded"
          get tifm.txt "$HZ/tif.medium-onlydomains.txt" || echo "::warning::HaGeZi TIF medium not downloaded"
          # build NAME LOG SOURCES...: NAME.bin (v2, every firmware) and NAME-v4.bin (fuse filter)
          build() {
            name=$1; log=$2; shift 2
            python3 tools/build_blocklist.py "$name.bin" $sign --format=v2 "$@" | tee "$log" &&
            python3 tools/build_blocklist.py "$name-v4.bin" $sign "$@" | tee "${log%.log}-v4.log"
          }
          # Normal (default, blocklist.bin): StevenBlack + HaGeZi Light, fits every board.
          build blocklist build.log src/sb.txt src/light.txt
          # Light: StevenBlack only (fewest false positives).
          build blocklist-light build-light.log src/sb.txt
          # Aggressive: StevenBlack + HaGeZi Pro, 8 MB boards and up (~255k domains).
          build blocklist-aggressive build-aggressive.log src/sb.txt src/pro.txt
          # Strict: Aggressive + HaGeZi Threat Intelligence Feeds medium (the most
          # active malware and phishing domains), 8 MB boards and up (~600k).
          # Extended: Aggressive + the full Threat Intelligence Feeds, 16 MB boards
          # (~2.1M). Both optional: if one fails, yesterday's files stay published
          # and the other lists still go out.
          { [ -f src/tifm.txt ] && build blocklist-strict build-strict.log src/sb.txt src/pro.txt src/tifm.txt; } ||
            { rm -f blocklist-strict.bin blocklist-strict-v4.bin; echo "::warning::Strict list not built"; }
          { [ -f src/tif.txt ] && build blocklist-extended build-extended.log src/sb.txt src/pro.txt src/tif.txt; } ||
            { rm -f blocklist-extended.bin blocklist-extended-v4.bin; echo "::warning::Extended list not built"; }
          rm -f /tmp/bl.pem
      - name: Sanity checks (size fits the smallest board each list is offered to)
        run: |
          domains() { grep 'hash entries' "$1" | grep -oE '[0-9,]+' | head -1 | tr -d ,; }
          # file  log  max bytes (slot of the smallest layout it is for)  min domains (catches a shrunk list)
          check() {
            size=$(stat -c%s "$1"); n=$(domains "$2")
            echo "$1: $size bytes, $n domains (max $3 bytes, min $4 domains)"
            [ "$size" -le "$3" ] && [ "$n" -ge "$4" ]
          }
          # One format of a list; the v2 file must stay v2 (byte 4 of the header).
          one() {
            local file=$1 log=$2 format=$3 max=$4 min=$5
            [ "$(od -An -tu1 -j4 -N1 "$file" | tr -d ' ')" = "$format" ] && check "$file" "$log" "$max" "$min"
          }
          both() {  # NAME LOG MAX MIN: NAME.bin (v2) and NAME-v4.bin
            local name=$1 log=$2 max=$3 min=$4
            one "$name.bin" "$log" 2 "$max" "$min" && one "$name-v4.bin" "${log%.log}-v4.log" 4 "$max" "$min"
          }
          both blocklist            build.log            $((0xB0000))  50000    # 4 MB layout slot
          both blocklist-light      build-light.log      $((0xB0000))  30000    # 4 MB layout slot
          both blocklist-aggressive build-aggressive.log $((0x270000)) 150000   # 8 MB layout slot
          if [ -f blocklist-strict.bin ] && \
             ! both blocklist-strict build-strict.log $((0x270000)) 300000; then   # 8 MB layout slot
            rm -f blocklist-strict.bin blocklist-strict-v4.bin
            echo "::warning::Strict list out of bounds: not published today"
          fi
          # Extended, each format on its own (16 MB layout slot). The threat feeds
          # grow and shrink by hundreds of thousands of domains, and the v2 file is
          # the bigger one: a file that no longer fits steps down to Strict, under
          # the Extended name, so boards keep a list close to the one they chose
          # (and get the full one back when it fits again) instead of stepping
          # themselves down to Aggressive for good.
          : > extended-steps.txt
          for fmt in 2 4; do
            [ -f blocklist-extended.bin ] || break   # not built: yesterday's files stay
            if [ "$fmt" = 2 ]; then f=blocklist-extended.bin s=blocklist-strict.bin log=build-extended.log
            else f=blocklist-extended-v4.bin s=blocklist-strict-v4.bin log=build-extended-v4.log; fi
            one "$f" "$log" "$fmt" $((0x670000)) 800000 && continue
            if [ -f "$s" ]; then
              cp "$s" "$f"
              echo "v$fmt" >> extended-steps.txt
              echo "::warning::Extended v$fmt does not fit the 16 MB slot: published as Strict today"
            else
              rm -f blocklist-extended.bin blocklist-extended-v4.bin
              echo "::warning::Extended list out of bounds and no Strict list: not published today"
            fi
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n() { grep 'hash entries' "$1" | grep -oE '[0-9,]+' | head -1; }
          files="blocklist.bin blocklist-light.bin blocklist-aggressive.bin"
          files="$files blocklist-v4.bin blocklist-light-v4.bin blocklist-aggressive-v4.bin"
          ext=""
          if [ -f blocklist-strict.bin ]; then
            files="$files blocklist-strict.bin blocklist-strict-v4.bin"
            ext=" · Strict (8 MB boards): $(n build-strict.log)"
          fi
          if [ -f blocklist-extended.bin ]; then
            files="$files blocklist-extended.bin blocklist-extended-v4.bin"
            ext="$ext · Extended (16 MB boards): $(n build-extended.log)"
            case "$(paste -sd' ' extended-steps.txt)" in
              "v2 v4") ext="$ext (too big today: both files hold the Strict list)" ;;
              v2|v4) ext="$ext (too big today: the $(cat extended-steps.txt) file holds the Strict list)" ;;
              *) ;;  # both fit
            esac
          fi
          notes="Auto-built $(date -u +%F). Normal (blocklist.bin): $(n build.log) domains · Light: $(n build-light.log) · Aggressive (8 MB boards): $(n build-aggressive.log)$ext

          Each list comes in two formats with the same domains: \`NAME.bin\` (compact, every firmware) and \`NAME-v4.bin\` (fuse filter, firmware 0.5.0 and later, which fetch it automatically).

          Built from [StevenBlack/hosts](https://github.com/StevenBlack/hosts) (MIT) and [HaGeZi DNS Blocklists](https://github.com/hagezi/dns-blocklists) (GPL-3.0): Light, Pro and Threat Intelligence Feeds. These files are hashed derivatives of those lists, under the same licenses; tools/build_blocklist.py rebuilds them from the sources."
          gh release view blocklist >/dev/null 2>&1 || \
            gh release create blocklist --title "Daily blocklist" --notes "$notes" --latest=false
          gh release edit blocklist --notes "$notes"
          gh release upload blocklist $files --clobber
